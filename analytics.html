<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Smart Campus</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Smart Campus Event Management</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="analytics.html" class="active">Analytics</a>
            <a href="#" id="logout">Logout</a>
        </nav>
    </header>

    <main>
        <h2>Analytics Dashboard</h2>
        <div class="analytics-grid">
            <div class="chart-container">
                <h3>Events by Status</h3>
                <canvas id="eventsByStatusChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Room Usage</h3>
                <canvas id="roomUsageChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Users by Role</h3>
                <canvas id="usersByRoleChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Top Event Creators</h3>
                <canvas id="topCreatorsChart"></canvas>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card">
                <h3>Total Events</h3>
                <p id="totalEvents">0</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
