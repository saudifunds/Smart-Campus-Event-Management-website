<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Smart Campus">
    <title>404 - Page Not Found | Smart Campus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="Assets/logo.png">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #2C1A0E, #5C3D2E);
            color: #F5ECD7;
        }

        .error-container h1 {
            font-size: 120px;
            margin: 0;
            font-weight: 700;
            color: #E06B4A;
        }

        .error-container h2 {
            font-size: 32px;
            margin: 20px 0;
        }

        .error-container p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .error-container .btn {
            background: #C85A3C;
            color: #FAF6F0;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s ease;
            display: inline-block;
        }

        .error-container .btn:hover {
            background: #FAF6F0;
            color: #2C1A0E;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="index.html" class="btn">Go to Dashboard</a>
        <a href="login.html" class="btn" style="margin-left: 15px;">Login</a>
    </div>
</body>

</html>
