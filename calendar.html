<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View campus events in calendar format">
  <title>Smart Campus | Calendar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="Assets/logo.png">
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <img src="Assets/logo.png" alt="Logo">
      <h2>SmartCampus</h2>
    </div>
    <nav>
      <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="student-manage-events.html"><i class="fas fa-list"></i> Events List</a>
      <a href="calendar.html" class="active"><i class="fas fa-calendar-days"></i> Calendar</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <h1><i class="fas fa-calendar-alt"></i> Event Calendar</h1>
    </header>

    <section class="content">
      <div class="calendar-container">
        <!-- Calendar Header -->
        <div class="calendar-header">
          <button id="prevMonth" class="nav-btn"><i class="fas fa-chevron-left"></i> Previous</button>
          <h2 id="monthYear"></h2>
          <button id="nextMonth" class="nav-btn">Next <i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid">
          <div class="calendar-day-header">Sun</div>
          <div class="calendar-day-header">Mon</div>
          <div class="calendar-day-header">Tue</div>
          <div class="calendar-day-header">Wed</div>
          <div class="calendar-day-header">Thu</div>
          <div class="calendar-day-header">Fri</div>
          <div class="calendar-day-header">Sat</div>
          <div id="calendarDays" class="calendar-days"></div>
        </div>

        <!-- Events for Selected Date -->
        <div class="events-sidebar">
          <h3 id="selectedDate" style="margin-bottom: 15px;">Select a date</h3>
          <div id="dayEvents" class="day-events">
            <p style="color: #888; text-align: center;">No events selected</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Notifications -->
  <div id="notificationContainer" class="notification-container"></div>

  <!-- 💬 Smart Campus Assistant -->
  <div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header" onclick="toggleChatbot()">
      <span>💬 Smart Campus Assistant</span>
      <span id="chatbotToggle">▲</span>
    </div>

    <div class="chatbot-body" id="chatbotBody">
      <div id="chatbotMessages" class="chatbot-messages">
        <div class="bot-message">Hi 👋! I'm your Smart Campus Assistant. How can I help you today?</div>
      </div>
      <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Type your question..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="css/chatbot.css">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/chatbot.js"></script>
</body>

</html>
