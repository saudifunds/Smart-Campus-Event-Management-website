<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus | Event Approvals</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="Assets/logo.png">
  <style>
    .approval-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-elevation-low);
      animation: slideInFromLeft 0.4s ease-out;
    }

    .approval-card h3 {
      color: var(--text-color);
      margin: 0 0 12px 0;
      font-size: 20px;
    }

    .approval-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .approval-details div {
      display: flex;
      flex-direction: column;
    }

    .approval-details strong {
      color: var(--text-color);
      margin-bottom: 4px;
    }

    .approval-details p {
      color: var(--muted);
      margin: 0;
    }

    .organizer-info {
      background: rgba(196, 30, 58, 0.05);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .organizer-info strong {
      color: var(--text-color);
    }

    .approval-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .approval-actions .btn {
      flex: 1;
    }

    .denial-reason {
      display: none;
      margin-top: 12px;
    }

    .denial-reason textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #f8fafc;
      color: var(--text-color);
      font-family: inherit;
      min-height: 80px;
      resize: vertical;
    }

    .no-pending {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .no-pending i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(249, 168, 37, 0.2);
      color: #f9a825;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="Assets/logo.png" alt="Logo">
      <h2>SmartCampus</h2>
    </div>
    <nav id="sidebarMenu">
      <!-- Sidebar items generated by JS -->
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Event Approvals</h1>
      <div class="actions">
        <button id="themeToggle" class="btn">🌙 Dark Mode</button>
        <button class="btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <section class="content">
      <div id="pendingEventsContainer"></div>
    </section>
  </main>

  <!-- Denial Reason Modal -->
  <div id="denialModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Deny Event Request</h3>
      <textarea id="denialReason" placeholder="Provide a reason for denial..." style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: #f8fafc; color: var(--text-color); font-family: inherit; min-height: 120px; resize: vertical;"></textarea>
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button class="btn primary" onclick="confirmDeny()">Confirm Denial</button>
        <button class="btn" onclick="closeDenialModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script src="js/admin-approve-events.js"></script>
</body>

</html>
