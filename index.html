<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Campus Event Management System - Manage events, rooms, and users efficiently">
  <meta name="keywords" content="campus management, event management, room booking, smart campus">
  <title>Smart Campus | Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="Assets/logo.png">
</head>

<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="Assets/logo.png" alt="Logo">
      <h2>SmartCampus</h2>
    </div>
    <nav id="sidebarMenu">
      <!-- Sidebar items will be generated by JS -->
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="dashboardTitle">Dashboard</h1>
      <div class="actions">
        <button id="themeToggle" class="btn">🌙 Dark Mode</button>
        <button class="btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <section class="content" id="dashboardContent">
      <!-- Role-specific dashboard will appear here -->
    </section>
  </main>

  <!-- 💬 Smart Campus Assistant -->
  <div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header" onclick="toggleChatbot()">
      <span>💬 Smart Campus Assistant</span>
      <span id="chatbotToggle">▲</span>
    </div>

    <div class="chatbot-body" id="chatbotBody">
      <div id="chatbotMessages" class="chatbot-messages">
        <div class="bot-message">Hi 👋! I'm your Smart Campus Assistant. How can I help you today?</div>
      </div>
      <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Type your question..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="css/chatbot.css">
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script src="js/chatbot.js"></script>
</body>

</html>
