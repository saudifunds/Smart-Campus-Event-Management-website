<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage users and roles for Smart Campus">
  <title>Smart Campus | Users</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="Assets/logo.png">
</head>

<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="Assets/logo.png" alt="Logo">
      <h2>SmartCampus</h2>
    </div>
    <nav>
      <a href="index.html">🏠 Dashboard</a>
      <a href="rooms.html">🏫 Rooms</a>
      <a href="events.html">📅 Events</a>
      <a href="users.html" class="active">👥 Users</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>User Management</h1>
      <button id="openUserModal" class="btn">+ Add User</button>
    </header>

    <section class="content">
      <table class="event-table" id="userTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h3 id="userModalTitle">Add User</h3>
      <form id="userForm">
        <input type="hidden" id="editUserIndex">
        <label>Full Name:</label>
        <input type="text" id="userName" required>
        <label>Email:</label>
        <input type="email" id="userEmail" required>
        <label>Role:</label>
        <select id="userRole">
          <option value="Student">Student</option>
          <option value="Staff">Staff</option>
          <option value="Admin">Admin</option>
        </select>
        <button type="submit" class="btn">Save</button>
        <button type="button" id="closeUserModal" class="btn cancel">Cancel</button>
      </form>
    </div>
  </div>
  <!-- 💬 Smart Campus Assistant -->
  <div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header" onclick="toggleChatbot()">
      <span>💬 Smart Campus Assistant</span>
      <span id="chatbotToggle">▲</span>
    </div>

    <div class="chatbot-body" id="chatbotBody">
      <div id="chatbotMessages" class="chatbot-messages">
        <div class="bot-message">Hi 👋! I'm your Smart Campus Assistant. How can I help you today?</div>
      </div>
      <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Type your question..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="css/chatbot.css">
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
  <script src="js/chatbot.js"></script>
</body>

</html>
