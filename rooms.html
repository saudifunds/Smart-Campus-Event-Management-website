<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage and track campus room availability">
  <title>Smart Campus | Rooms</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="Assets/logo.png">
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <img src="Assets/logo.png" alt="Logo">
      <h2>SmartCampus</h2>
    </div>
    <nav>
      <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
      <a href="rooms.html" class="active"><i class="fas fa-door-open"></i> Rooms</a>
      <a href="events.html"><i class="fas fa-calendar-check"></i> Events</a>
      <a href="users.html"><i class="fas fa-users-gear"></i> Users</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <h1>Room Management</h1>
      <button id="addRoomBtn" class="btn"><i class="fas fa-plus"></i> Add Room</button>
    </header>

    <section class="content">
      <table id="roomTable">
        <thead>
          <tr>
            <th>Room Name</th>
            <th>Capacity</th>
            <th>Type</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal" id="roomModal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Room</h3>
      <form id="roomForm">
        <label>Room Name:</label>
        <input type="text" id="roomName" required>
        <label>Capacity:</label>
        <input type="number" id="roomCapacity" required>
        <label>Type:</label>
        <select id="roomType">
          <option value="Lecture Hall">Lecture Hall</option>
          <option value="Lab">Lab</option>
          <option value="Office">Office</option>
        </select>
        <label>Status:</label>
        <select id="roomStatus">
          <option value="Available">Available</option>
          <option value="Occupied">Occupied</option>
          <option value="Maintenance">Maintenance</option>
        </select>

        <button type="submit" class="btn">Save</button>
        <button type="button" id="closeRoomModal" class="btn cancel">Cancel</button>
      </form>
    </div>
  </div>
  <!-- 💬 Smart Campus Assistant -->
  <div class="chatbot-container" id="chatbotContainer">
    <div class="chatbot-header" onclick="toggleChatbot()">
      <span>💬 Smart Campus Assistant</span>
      <span id="chatbotToggle">▲</span>
    </div>

    <div class="chatbot-body" id="chatbotBody">
      <div id="chatbotMessages" class="chatbot-messages">
        <div class="bot-message">Hi 👋! I'm your Smart Campus Assistant. How can I help you today?</div>
      </div>
      <div class="chatbot-input-area">
        <input type="text" id="chatbotInput" placeholder="Type your question..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="css/chatbot.css">
  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/chatbot.js"></script>
</body>

</html>
